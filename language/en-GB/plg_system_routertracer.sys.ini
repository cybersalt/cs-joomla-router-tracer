PLG_SYSTEM_ROUTERTRACER="System - Router Tracer"
PLG_SYSTEM_ROUTERTRACER_DESC="A powerful debugging tool for Joomla SEF URL issues and redirect loops. Logs all router events, URL manipulations, Apache .htaccess rewrites, and SEF plugin activity with timestamps and stack traces. Includes a built-in dark-themed log viewer with filtering, search, and loop detection. Essential for diagnosing conflicts between SEF plugins like 4SEF, sh404SEF, and Joomla's core SEF."
PLG_SYSTEM_ROUTERTRACER_POSTINSTALL_INSTALLED="The plugin has been successfully installed."
PLG_SYSTEM_ROUTERTRACER_POSTINSTALL_UPDATED="The plugin has been successfully updated."
PLG_SYSTEM_ROUTERTRACER_POSTINSTALL_OPEN="Open Router Tracer Settings"
PLG_SYSTEM_ROUTERTRACER_POSTINSTALL_OLD_LOGS_REMOVED="Router Tracer removed %1$d old log file(s) from %2$s. Older versions saved the log there, where visitors could download it. The log is now kept in Joomla's log folder and can't be opened from a browser."
PLG_SYSTEM_ROUTERTRACER_POSTINSTALL_OLD_LOGS_FAILED="Router Tracer couldn't remove these old log files, which visitors may be able to download. Please delete them: %s"
